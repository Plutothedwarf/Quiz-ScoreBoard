<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Arena Scorer</title>
<style>
:root{--bg:#0d1117;--panel:#151b25;--panel2:#1c2432;--text:#e8ebf2;--mute:#8b94a8;--line:#263044;--acc:#6ea8fe;--good:#2f8f5b;--goodh:#38a56a;--bad:#a8354a;--badh:#c0405a;--grid:#1f2837;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f8;--panel:#fff;--panel2:#eaeef6;--text:#141a2a;--mute:#5d677c;--line:#d5dbe8;--acc:#2f6fd6;--grid:#e6eaf3}}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#151b25;--panel2:#1c2432;--text:#e8ebf2;--mute:#8b94a8;--line:#263044;--acc:#6ea8fe;--grid:#1f2837}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;min-height:100vh}
.wrap{max-width:1500px;margin:0 auto;padding:22px 28px 40px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;outline:none;padding:2px 6px;border-radius:6px}
h1:focus{background:var(--panel2)}
.sub{color:var(--mute);font-size:12px;margin:2px 6px 0;letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{font:inherit;color:var(--text)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;transition:background .15s,transform .08s}
button:hover{background:var(--line)}button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#0a1220;border-color:var(--acc)}button.pri:hover{filter:brightness(1.1);background:var(--acc)}
.chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:#e3b341}.dot.ok{background:#3fb97a}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media(max-width:1050px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{margin:0 0 16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:24px}
.chart{position:relative;height:390px;padding-top:26px}
.plot{position:absolute;left:46px;right:0;top:26px;bottom:0}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.gl.z{border-top:1px solid var(--mute)}
.gl span{position:absolute;left:-46px;width:38px;text-align:right;transform:translateY(-50%);font-size:11px;color:var(--mute)}
.cols{position:absolute;inset:0;display:flex}
.col{flex:1;position:relative}
.bar{position:absolute;left:20%;right:20%;border-radius:6px 6px 0 0;transition:height .55s cubic-bezier(.2,.8,.2,1),bottom .55s cubic-bezier(.2,.8,.2,1)}
.bar.neg{border-radius:0 0 6px 6px;background-image:repeating-linear-gradient(135deg,rgba(0,0,0,.3) 0 6px,transparent 6px 12px)}
.val{position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;transition:bottom .55s cubic-bezier(.2,.8,.2,1)}
.names{display:flex;margin:10px 0 0 46px}
.names div{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.teams{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:14px}
.team{padding:16px}
.bottom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
@media(max-width:1050px){.bottom{grid-template-columns:1fr}}
@media(max-width:1100px){.teams{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.team{border-top:3px solid var(--c)}
.th{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tn{font-weight:700;font-size:15px;outline:none;border-radius:6px;padding:2px 6px;margin-left:-6px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn:focus{background:var(--panel2)}
.rank{font-size:12px;font-weight:700;color:var(--mute);background:var(--panel2);border-radius:99px;padding:3px 10px}
.sr{display:flex;align-items:baseline;gap:12px;margin:14px 0 18px}
.score{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--c)}
.last{font-size:12px;color:var(--mute)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acts button{padding:10px 4px;line-height:1.25;font-size:12px}
.acts button b{display:block;font-size:15px}
.ok{background:var(--good);border-color:var(--good);color:#fff}.ok:hover{background:var(--goodh)}
.no{background:var(--bad);border-color:var(--bad);color:#fff}.no:hover{background:var(--badh)}
.adj{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.adj label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips button{flex:1 0 28%;padding:5px 0;font-size:11px;min-width:0}
.adjr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"v a" "w w";gap:8px}.adjr [data-v]{grid-area:v}.adjr [data-apply]{grid-area:a}.adjr [data-why]{grid-area:w}
input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px;width:100%}
.ctl .big{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ctl .big button{width:42px;height:42px;padding:0;font-size:20px}
.ctl .q{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.ctl small{display:block;color:var(--mute);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:20px}.seg button.on{background:var(--acc);color:#0a1220;border-color:var(--acc)}
.tm{display:flex;align-items:center;gap:10px}.tmv{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px}.tmv.low{color:#e5606e}
.pb{height:4px;background:var(--panel2);border-radius:4px;margin-top:12px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);width:100%}
.lb div{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.lb div:last-child{border:0}.lb i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.lb b{font-variant-numeric:tabular-nums}
.log{max-height:260px;overflow:auto;font-size:12.5px;color:var(--mute)}
.log div{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.log button{padding:0 8px;font-size:14px;background:none;border:0;color:var(--mute)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(6,9,16,.9);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}.modal.show{display:flex}
.pod{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin:24px 0}
.pod div{width:min(26vw,160px);text-align:center;border-radius:10px 10px 0 0;padding:12px 4px;font-weight:700;color:#10141c}.pod small{display:block;font-size:26px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1 id="title" contenteditable="true" spellcheck="false">Quiz Arena</h1><div class="sub">Scorer console</div></div>
  <div class="row">
    <div class="chip"><span class="dot" id="dot"></span><span id="sync">Saved on this device</span></div>
    <button id="bk">Backup</button><button id="rs">Restore</button><input type="file" id="rf" accept=".json" hidden>
    <button class="pri" id="xl">Download Excel</button>
  </div>
</header>
<div class="stack">
    <div class="card"><h2>Scoreboard</h2><div class="chart" id="chart"><div class="plot"><div id="gl"></div><div class="cols" id="cols"></div></div></div><div class="names" id="names"></div></div>
    <div class="teams" id="teams"></div>
  <div class="bottom">
    <div class="card ctl">
      <h2>Match control</h2>
      <small>Current question (saved with every score)</small>
      <div class="big"><button id="qm">&minus;</button><span class="q">Q<span id="qn">1</span></span><button id="qp">+</button></div>
      <small>Round</small><div class="seg" id="rounds"></div>
      <small>Thinking window</small>
      <div class="tm"><span class="tmv" id="tm">20</span><button id="tgo">Start</button><button id="trs">Reset</button><select id="tw" style="width:auto"><option>10</option><option>20</option><option>30</option><option>45</option><option>60</option></select></div>
      <div class="pb"><i id="pb"></i></div>
    </div>
    <div class="card"><h2>Standings</h2><div class="lb" id="lb"></div></div>
    <div class="card"><h2>Activity</h2>
      <div class="tools"><button id="undo">Undo last</button><button id="pod">Podium</button><button id="add">+ Team</button><button id="del">&minus; Team</button></div>
      <div class="log" id="log"></div>
      <button id="rst" style="width:100%;margin-top:16px">Reset all scores</button>
    </div>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div style="text-align:center"><h1 style="display:inline-block">Podium</h1><div class="pod" id="podium"></div><button id="mc">Close</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
const COLORS=['#e5606e','#5b9bd5','#e3b341','#4fb286','#9b87d6','#e08a4a','#4cb8c4','#d77fa1'];
const KEY='quizArenaV1',BAK='quizArenaV1_prev';
let S=null;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fresh(){return{title:'Quiz Arena',q:1,round:'A',win:20,ts:0,cust:{},log:[],teams:[0,1,2,3,4].map(i=>({id:'t'+i,name:'Team '+'ABCDEFGH'[i],color:COLORS[i]}))}}
function norm(o){const d=fresh();o=Object.assign(d,o||{});o.log=o.log||[];o.teams=o.teams&&o.teams.length?o.teams:d.teams;o.cust=o.cust||{};return o}
try{S=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){try{S=norm(JSON.parse(localStorage.getItem(BAK)))}catch(e2){S=fresh()}}
const typeOf=l=>l.type||(l.reason==='Direct correct'?'direct':l.reason==='Pounce correct'?'pounce':l.reason==='Pounce wrong'?'wrong':'adj');
const score=(id,rd)=>S.log.filter(l=>l.team===id&&(!rd||l.round===rd)).reduce((a,l)=>a+l.delta,0);
const ranked=()=>S.teams.map(t=>({t,s:score(t.id)})).sort((a,b)=>b.s-a.s);

// ---------- persistence: local (instant, with previous-version copy) + cloud (db) when available
let ref=null,pushing=false,pushAgain=false,pt=null;
function setSync(txt,ok){$('sync').textContent=txt;$('dot').classList.toggle('ok',!!ok)}
function persist(){try{const cur=localStorage.getItem(KEY);if(cur)localStorage.setItem(BAK,cur);localStorage.setItem(KEY,JSON.stringify(S))}catch(e){setSync('Local save failed. Use Backup',false)}}
function commit(){S.ts=Date.now();persist();schedule()}
function schedule(){if(!ref)return;setSync('Saving...',false);clearTimeout(pt);pt=setTimeout(push,700)}
async function push(){if(pushing){pushAgain=true;return}pushing=true;
  try{await ref.set({json:JSON.stringify(S),ts:S.ts});setSync('Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' (cloud + device)',true)}
  catch(e){setSync('Saved on this device only',false)}
  pushing=false;if(pushAgain){pushAgain=false;push()}}
async function initCloud(){try{if(!window.claude)return;const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;const id=await u.id();if(!id)return;
  ref=db.doc('data/users/'+id+'/quiz');const snap=await ref.get();
  if(snap.exists&&snap.data().ts>S.ts){S=norm(JSON.parse(snap.data().json));persist();build();toast('Restored newer scores from cloud')}
  else if(S.ts||S.log.length){await push()}else setSync('Cloud ready',true)}catch(e){}}
addEventListener('pagehide',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)}
function award(id,delta,reason,type){S.log.push({q:S.q,round:S.round,team:id,delta,reason,type,t:Date.now()});commit();update()}

function build(){
  $('cols').innerHTML=S.teams.map(t=>`<div class="col" data-id="${t.id}"><div class="bar" style="background-color:${t.color}"></div><div class="val"></div></div>`).join('');
  $('names').innerHTML=S.teams.map(t=>`<div data-id="${t.id}"></div>`).join('');
  $('teams').innerHTML=S.teams.map(t=>`<div class="card team" data-id="${t.id}" style="--c:${t.color}">
    <div class="th"><div class="tn" contenteditable="true" spellcheck="false"></div><span class="rank"></span></div>
    <div class="sr"><span class="score">0</span><span class="last"></span></div>
    <div class="acts">
      <button class="ok" data-a="10" data-r="Direct correct" data-k="direct">Direct<b>+10</b></button>
      <button class="ok" data-a="10" data-r="Pounce correct" data-k="pounce">Pounce<b>+10</b></button>
      <button class="no" data-a="-5" data-r="Pounce wrong" data-k="wrong">Wrong<b>-5</b></button>
    </div>
    <div class="adj"><label>Custom adjustment</label>
      <div class="chips">${[-10,-5,-2,2,5,10].map(v=>`<button data-chip="${v}">${v>0?'+':''}${v}</button>`).join('')}</div>
      <div class="adjr"><input type="number" step="1" placeholder="+/-" data-v><select data-why><option>Bonus</option><option>Penalty</option><option>Correction</option><option>Other</option></select><button data-apply class="pri">Apply</button></div>
    </div></div>`).join('');
  $('rounds').innerHTML=['A','B','C'].map(r=>`<button data-r="${r}">Round ${r}</button>`).join('');
  $('tw').value=S.win;tv=S.win;drawT();update(true);
}
function nice(x){for(const s of [5,10,20,25,50,100,200,250,500,1000])if(s>=x)return s;return 1000}
function update(first){
  if($('title').textContent!==S.title)$('title').textContent=S.title;
  $('qn').textContent=S.q;
  document.querySelectorAll('#rounds button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.round));
  const sc=S.teams.map(t=>score(t.id));
  const st=nice((Math.max(10,...sc)-Math.min(0,...sc))/5);
  const amax=Math.ceil(Math.max(10,...sc)/st)*st,amin=Math.floor(Math.min(0,...sc)/st)*st-(Math.min(0,...sc)<0?st:0),tot=amax-amin;
  let g='';for(let v=amin;v<=amax;v+=st)g+=`<div class="gl${v===0?' z':''}" style="bottom:${(v-amin)/tot*100}%"><span>${v}</span></div>`;
  $('gl').innerHTML=g;
  const best=Math.max(...sc);
  S.teams.forEach((t,i)=>{const s=sc[i],h=Math.abs(s)/tot*100,b0=(0-amin)/tot*100,col=document.querySelector(`.col[data-id="${t.id}"]`);
    col.firstChild.style.height=h+'%';col.firstChild.style.bottom=(s>=0?b0:b0-h)+'%';
    col.firstChild.classList.toggle('neg',s<0);col.lastChild.style.bottom=s>=0?`calc(${b0+h}% + 5px)`:`calc(${b0-h}% - 24px)`;col.lastChild.style.color=s<0?'#ef6b73':t.color;col.lastChild.textContent=(s>0&&s===best?'\u2605 ':'')+s;
    document.querySelector(`.names div[data-id="${t.id}"]`).textContent=t.name;
    const c=document.querySelector(`.team[data-id="${t.id}"]`);c.querySelector('.score').textContent=s;
    c.querySelector('.rank').textContent='Rank '+(sc.filter(x=>x>s).length+1);
    const ll=[...S.log].reverse().find(l=>l.team===t.id);c.querySelector('.last').textContent=ll?`Last: ${ll.delta>0?'+':''}${ll.delta} (Q${ll.q})`:'No scores yet';
    const n=c.querySelector('.tn');if(first||document.activeElement!==n)n.textContent=t.name});
  const mx=Math.max(1,...sc.map(Math.abs));
  $('lb').innerHTML=ranked().map((x,i)=>`<div><span style="color:var(--mute)">${i+1}</span><span><i style="background:${x.t.color}"></i>${esc(x.t.name)}</span><b>${x.s}</b></div>`).join('');
  $('log').innerHTML=S.log.slice(-40).map((l,i,a)=>{const idx=S.log.length-a.length+i,t=S.teams.find(x=>x.id===l.team);
    return `<div><span>Q${l.q} R${l.round} &middot; <b style="color:${t?t.color:'inherit'}">${t?esc(t.name):'?'}</b> &middot; ${esc(l.reason)}</span><span><b style="color:var(--text)">${l.delta>0?'+':''}${l.delta}</b><button data-del="${idx}" title="Remove this entry">&times;</button></span></div>`}).reverse().join('')||'No scores yet.';
}
$('teams').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=b.closest('.team'),id=c.dataset.id,inp=c.querySelector('[data-v]');
  if(b.dataset.a)return award(id,+b.dataset.a,b.dataset.r,b.dataset.k);
  if(b.dataset.chip){inp.value=b.dataset.chip;return inp.focus()}
  if(b.hasAttribute('data-apply'))applyAdj(c)});
$('teams').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.hasAttribute('data-v'))applyAdj(e.target.closest('.team'))});
function applyAdj(c){const inp=c.querySelector('[data-v]'),v=parseInt(inp.value);if(!v)return toast('Enter a non-zero number');
  award(c.dataset.id,v,'Adjustment: '+c.querySelector('[data-why]').value,'adj');inp.value=''}
$('teams').addEventListener('input',e=>{if(e.target.classList.contains('tn')){const id=e.target.closest('.team').dataset.id,t=S.teams.find(x=>x.id===id);t.name=e.target.textContent.slice(0,18);commit();document.querySelector(`.names div[data-id="${id}"]`).textContent=t.name}});
$('title').addEventListener('input',()=>{S.title=$('title').textContent;commit()});
$('rounds').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.round=b.dataset.r;commit();update()}});
$('qp').onclick=()=>{S.q++;commit();update()};$('qm').onclick=()=>{S.q=Math.max(1,S.q-1);commit();update()};
$('log').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b){S.log.splice(+b.dataset.del,1);commit();update();toast('Entry removed')}});
$('undo').onclick=()=>{if(S.log.pop()){commit();update();toast('Last score undone')}};
$('add').onclick=()=>{if(S.teams.length>=8)return toast('Maximum 8 teams');const i=S.teams.length;S.teams.push({id:'t'+Date.now(),name:'Team '+'ABCDEFGH'[i],color:COLORS[i]});commit();build()};
$('del').onclick=()=>{if(S.teams.length<=2)return toast('Minimum 2 teams');const t=S.teams.pop();S.log=S.log.filter(l=>l.team!==t.id);commit();build();toast(t.name+' removed')};
let armed=0;$('rst').onclick=()=>{if(!armed){armed=1;$('rst').textContent='Tap again to erase all scores';setTimeout(()=>{armed=0;$('rst').textContent='Reset all scores'},3000);return}
  S.log=[];S.q=1;S.round='A';armed=0;$('rst').textContent='Reset all scores';commit();update();toast('All scores reset')};
$('pod').onclick=()=>{const r=ranked().slice(0,3),h=[190,140,105],m=['\u{1F947}','\u{1F948}','\u{1F949}'],c=['#e3b341','#c5cde0','#d58c5a'];
  $('podium').innerHTML=[1,0,2].map(i=>r[i]?`<div style="background:${c[i]};height:${h[i]}px"><small>${m[i]}</small>${esc(r[i].t.name)}<br>${r[i].s}</div>`:'').join('');$('modal').classList.add('show')};
$('mc').onclick=()=>$('modal').classList.remove('show');

// timer
let tv=20,ti=null;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),500)}catch(e){}}
function drawT(){$('tm').textContent=tv;$('tm').classList.toggle('low',tv<=5&&ti!==null);$('pb').style.width=(tv/S.win*100)+'%'}
$('tgo').onclick=()=>{if(ti){clearInterval(ti);ti=null;$('tgo').textContent='Start';return drawT()}if(tv<=0)tv=S.win;$('tgo').textContent='Pause';
  ti=setInterval(()=>{tv--;if(tv<=0){tv=0;clearInterval(ti);ti=null;$('tgo').textContent='Start';beep();toast('Pens down')}drawT()},1000);drawT()};
$('trs').onclick=()=>{clearInterval(ti);ti=null;tv=S.win;$('tgo').textContent='Start';drawT()};
$('tw').onchange=()=>{S.win=+$('tw').value;commit();$('trs').click()};

// backup / restore
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
async function dls(){let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}
  return d||{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}}}
$('bk').onclick=async()=>{const d=await dls();if(!d)return toast('Download is not available in this view');
  try{await d.save({filename:'quiz_backup_'+stamp()+'.json',data:JSON.stringify(S,null,1)});toast('Backup saved')}catch(e){toast('Backup cancelled')}};
$('rs').onclick=()=>$('rf').click();
$('rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.teams||!o.log)throw 0;S=norm(o);commit();build();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}e.target.value=''};

// excel
function chartPng(R){const cv=document.createElement('canvas');cv.width=900;cv.height=400;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,900,400);
  const vs=R.map(r=>r.s),hi=Math.max(10,...vs),lo=Math.min(0,...vs),st=nice((hi-lo)/5),amax=Math.ceil(hi/st)*st,amin=Math.floor(lo/st)*st-(lo<0?st:0),tot=amax-amin,L=50,T=40,H=270,W=830,bw=W/R.length,Y=v=>T+H*(amax-v)/tot;
  x.font='12px sans-serif';x.textAlign='right';
  for(let v=amin;v<=amax;v+=st){x.strokeStyle=v===0?'#667':'#dde2ee';x.lineWidth=v===0?1.5:1;x.beginPath();x.moveTo(L,Y(v));x.lineTo(L+W,Y(v));x.stroke();x.fillStyle='#667';x.fillText(v,L-8,Y(v)+4)}
  x.lineWidth=1;x.fillStyle='#1f2a44';x.font='bold 16px sans-serif';x.textAlign='left';x.fillText('Final scores',L,24);
  R.forEach((r,i)=>{const bx=L+i*bw+bw*.2,w=bw*.6,y0=Y(0),y1=Y(r.s),top=Math.min(y0,y1),h=Math.abs(y1-y0);
    x.fillStyle=r.t.color;x.fillRect(bx,top,w,h);
    if(r.s<0){x.save();x.beginPath();x.rect(bx,top,w,h);x.clip();x.strokeStyle='rgba(0,0,0,.28)';x.lineWidth=3;for(let k=-h;k<w+h;k+=10){x.beginPath();x.moveTo(bx+k,top);x.lineTo(bx+k+h,top+h);x.stroke()}x.restore()}
    x.textAlign='center';x.font='bold 14px sans-serif';x.fillStyle=r.s<0?'#c0392b':'#1f2a44';x.fillText(r.s,bx+w/2,r.s>=0?top-6:top+h+16);
    x.font='12px sans-serif';x.fillStyle='#1f2a44';x.fillText(r.t.name,bx+w/2,T+H+26)});
  return cv.toDataURL('image/png')}
$('xl').onclick=async()=>{const dl=await dls();if(!dl)return toast('Download is not available in this view');if(!window.ExcelJS)return toast('Excel library did not load');
  const wb=new ExcelJS.Workbook(),R=ranked(),NV='FF1F2A44',thin={style:'thin',color:{argb:'FFD5DBE8'}},bd={top:thin,bottom:thin,left:thin,right:thin};
  const hd=r=>{r.height=26;r.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NV}};c.alignment={horizontal:'center',vertical:'middle'};c.border=bd})};
  const cnt=(id,k)=>S.log.filter(l=>l.team===id&&typeOf(l)===k).length,adjn=id=>S.log.filter(l=>l.team===id&&typeOf(l)==='adj').reduce((a,l)=>a+l.delta,0);
  const ws=wb.addWorksheet('Final Standings',{views:[{showGridLines:false}]});
  ws.columns=[{width:8},{width:8},{width:24},{width:12},{width:12},{width:12},{width:12},{width:12},{width:36}];
  ws.mergeCells('A1:I1');const a1=ws.getCell('A1');a1.value=S.title.toUpperCase();a1.font={bold:true,size:22,color:{argb:'FFFFFFFF'}};a1.fill={type:'pattern',pattern:'solid',fgColor:{argb:NV}};a1.alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=44;
  ws.mergeCells('A2:I2');const a2=ws.getCell('A2');a2.value='Final standings | '+new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+' | '+new Set(S.log.map(l=>l.q)).size+' questions scored';a2.alignment={horizontal:'center'};a2.font={italic:true,color:{argb:'FF5D677C'}};
  ws.mergeCells('A4:I4');const w=ws.getCell('A4');const top=R.filter(r=>r.s===R[0].s);w.value='\u{1F3C6}  Winner: '+top.map(r=>r.t.name).join(' & ')+'  with '+R[0].s+' points';
  w.font={bold:true,size:16,color:{argb:'FF7A5A00'}};w.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF3BF'}};w.alignment={horizontal:'center',vertical:'middle'};ws.getRow(4).height=34;
  const h=ws.getRow(6);['Rank','Medal','Team','Total','Direct correct','Pounce correct','Pounce wrong','Adjust (net)','Score bar'].forEach((v,i)=>h.getCell(i+1).value=v);hd(h);
  const mxs=Math.max(10,R[0].s);let rk=0,pv=null;
  R.forEach((x,i)=>{if(x.s!==pv){rk=i+1;pv=x.s}const r=ws.getRow(7+i);
    r.values=[rk,rk===1?'\u{1F947}':rk===2?'\u{1F948}':rk===3?'\u{1F949}':'',x.t.name,x.s,cnt(x.t.id,'direct'),cnt(x.t.id,'pounce'),cnt(x.t.id,'wrong'),adjn(x.t.id),x.s>0?'\u2588'.repeat(Math.max(1,Math.round(x.s/mxs*28))):(x.s<0?'\u25BC'.repeat(Math.max(1,Math.min(14,Math.round(-x.s/mxs*28)))):'')]; r.height=26;
    for(let c=1;c<=9;c++){const cell=r.getCell(c);cell.border=bd;cell.alignment={horizontal:c===3||c===9?'left':'center',vertical:'middle'};if(rk<=3)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:['FFFFF8DC','FFF1F3F7','FFFCE8DA'][rk-1]}}}
    r.getCell(3).font={bold:true,size:13};r.getCell(4).font={bold:true,size:14,color:{argb:x.s<0?'FFC0392B':'FF1F2A44'}};r.getCell(9).font={color:{argb:x.s<0?'FFC0392B':'FF'+x.t.color.slice(1).toUpperCase()}}});
  const end=7+R.length;ws.mergeCells(`A${end+1}:I${end+1}`);ws.getCell(`A${end+1}`).value='Scoring: direct correct +10, pounce correct +10, wrong pounce -5, plus manual adjustments.';ws.getCell(`A${end+1}`).font={italic:true,size:10,color:{argb:'FF5D677C'}};
  const img=wb.addImage({base64:chartPng(R),extension:'png'});ws.addImage(img,{tl:{col:0,row:end+2},ext:{width:900,height:400}});
  const w2=wb.addWorksheet('By Round',{views:[{showGridLines:false}]});w2.columns=[{width:24},{width:12},{width:12},{width:12},{width:12}];
  hd(w2.addRow(['Team','Round A','Round B','Round C','Total']));
  R.forEach(x=>{const r=w2.addRow([x.t.name,score(x.t.id,'A'),score(x.t.id,'B'),score(x.t.id,'C'),x.s]);r.height=22;r.eachCell((c,n)=>{c.border=bd;c.alignment={horizontal:n===1?'left':'center'}});r.getCell(5).font={bold:true}});
  const w3=wb.addWorksheet('Score Log',{views:[{state:'frozen',ySplit:1}]});w3.columns=[{width:6},{width:6},{width:8},{width:22},{width:28},{width:10},{width:14}];
  hd(w3.addRow(['#','Q','Round','Team','Event','Points','Team total']));
  const run={};S.log.forEach((l,i)=>{const t=S.teams.find(x=>x.id===l.team);if(!t)return;run[l.team]=(run[l.team]||0)+l.delta;
    const r=w3.addRow([i+1,l.q,l.round,t.name,l.reason,l.delta,run[l.team]]);r.eachCell(c=>{c.border=bd;c.alignment={horizontal:'center'};if(i%2)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF6F8FC'}}});
    r.getCell(4).alignment={horizontal:'left'};r.getCell(6).font={bold:true,color:{argb:l.delta>=0?'FF1D6B3A':'FFB3364F'}}});
  try{const buf=await wb.xlsx.writeBuffer();await dl.save({filename:'Quiz_Final_Scores.xlsx',data:new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Excel ready')}
  catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Could not create the file')}};
build();persist();initCloud();
</script>
